name: Publicar la app
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'   # cada mañana (6:17 en invierno, 7:17 en verano): titulares nuevos
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crear iconos
        run: pip install pillow && python tools/make_icons.py
      - name: Preparar la web
        run: mkdir _site && cp -r index.html app.js sw.js manifest.webmanifest icons _site/
      - name: Entrenos del calendario
        env:
          ICS_URL: ${{ secrets.ENTRENOS_ICS }}
        run: pip install icalendar recurring-ical-events && python tools/entrenos.py _site/entrenos.json || echo '{"items":[]}' > _site/entrenos.json
      - name: Titulares del día
        run: python tools/news.py _site/news.json || echo '{"items":[]}' > _site/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
